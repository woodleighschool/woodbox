[tools]
periphery = "3.8.0"
swiftformat = "0.62.1"
lefthook = "2.1.11"
actionlint = "1.7.12"
zizmor = "1.29.0"
oxfmt = "0.65.0"
"npm:@commitlint/cli" = "21.2.2"

[settings]
experimental = true
pin = true
lockfile = true

[tasks.format]
description = "Format Swift code"
run = "swiftformat WoodBox WoodBoxTests"

[tasks.fmt-check]
description = "Check Swift formatting"
run = "swiftformat WoodBox WoodBoxTests --lint"

[tasks.build]
description = "Build the unsigned macOS app"
run = """
xcodebuild build \
  -project WoodBox.xcodeproj \
  -scheme WoodBox \
  -destination 'generic/platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.test]
description = "Run focused Swift tests"
run = """
xcodebuild test \
  -project WoodBox.xcodeproj \
  -scheme WoodBox \
  -destination 'platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.periphery]
description = "Build the macOS app and reject unused Swift code"
run = """
periphery scan \
  --project WoodBox.xcodeproj \
  --schemes WoodBox \
  --format xcode \
  --strict \
  --clean-build \
  --disable-update-check \
  --relative-results \
  -- \
  -destination 'generic/platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.lint]
description = "Run app lint"
depends = ["periphery"]

[tasks.workflow-lint]
description = "Lint GitHub Actions workflows"
run = ["actionlint", "zizmor --offline --no-ignores .github/workflows"]

[hooks]
postinstall = "lefthook install"
