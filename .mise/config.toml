[tools]
periphery = "3.8.0"
swiftformat = "0.64.6"
lefthook = "2.2.2"
jactionlint = "v2.5.0"
oxfmt = "0.75.0"

[settings]
experimental = true
pin = true
lockfile = true

[tasks.format]
run = "swiftformat WoodBox WoodBoxTests"

[tasks.fmt-check]
run = "swiftformat WoodBox WoodBoxTests --lint"

[tasks.build]
description = "Build the unsigned macOS app"
run = """
xcodebuild build \
  -project WoodBox.xcodeproj \
  -scheme WoodBox \
  -destination 'generic/platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.test]
description = "Run the macOS test suite"
run = """
xcodebuild test \
  -project WoodBox.xcodeproj \
  -scheme WoodBox \
  -destination 'platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.periphery]
description = "Build the macOS app and reject unused Swift code"
run = """
periphery scan \
  --project WoodBox.xcodeproj \
  --schemes WoodBox \
  --format xcode \
  --strict \
  --clean-build \
  --disable-update-check \
  --relative-results \
  -- \
  -destination 'generic/platform=macOS' \
  CODE_SIGNING_ALLOWED=NO
"""

[tasks.lint]
description = "Check for unused Swift code"
depends = ["periphery"]

[hooks]
postinstall = "lefthook install"
