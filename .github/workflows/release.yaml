---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches:
      - main
    paths:
      - "Config/**"
      - "WoodBox/**"
      - "WoodBox.xcodeproj/**"
      - "!Config/Version.xcconfig"
  release:
    types:
      - published

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: macOS release
    if: github.event_name == 'release'
    runs-on: xcode-27
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      APP_NAME: WoodBox
      PROJECT: WoodBox.xcodeproj
      SCHEME: WoodBox

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Import Developer ID Application certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Download Developer ID provisioning profile
        uses: apple-actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6.1.0
        with:
          bundle-id: au.edu.vic.woodleigh.WoodBox
          profile-type: MAC_APP_DIRECT
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate release version
        run: |
          VERSION="${RELEASE_TAG#v}"
          grep -Fqx "MARKETING_VERSION = ${VERSION} // x-release-please-version" Config/Version.xcconfig

      - name: Archive app
        run: |
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "${RUNNER_TEMP}/${APP_NAME}.xcarchive" \
            DEVELOPMENT_TEAM="SMLKBTR495" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="WoodBox" \
            archive

      - name: Export app
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/${APP_NAME}.xcarchive" \
            -exportPath "${RUNNER_TEMP}/export" \
            -exportOptionsPlist Config/ExportOptions.plist

      - name: Notarize app
        uses: woodleighschool/.github/actions/apple-notarize@a85ca6bcf210fe5e22e50da1d832f211c2b44605 # apple-notarize-v2.0.0
        with:
          product-path: ${{ runner.temp }}/export/${{ env.APP_NAME }}.app
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Verify app
        run: |
          APP_PATH="${RUNNER_TEMP}/export/${APP_NAME}.app"

          codesign --verify --deep --strict --verbose=2 "${APP_PATH}"
          spctl --assess --type execute --verbose=2 "${APP_PATH}"

      - name: Create ZIP
        run: |
          VERSION="${RELEASE_TAG#v}"

          mkdir -p dist
          ditto -c -k --keepParent \
            "${RUNNER_TEMP}/export/${APP_NAME}.app" \
            "dist/${APP_NAME}-${VERSION}.zip"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          gh release upload \
            "${RELEASE_TAG}" \
            "dist/${APP_NAME}-${VERSION}.zip" \
            --clobber

  upload:
    name: ${{ github.event_name == 'release' && 'App Store' || 'TestFlight' }}
    runs-on: xcode-27
    timeout-minutes: 30
    environment: ${{ github.event_name == 'release' && 'app-store' || 'testflight' }}
    env:
      APP_NAME: WoodBox
      PROJECT: WoodBox.xcodeproj
      SCHEME: WoodBox
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Import Apple Distribution certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPLE_DISTRIBUTION_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}

      - name: Write App Store Connect key
        env:
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          install -m 600 /dev/null "${RUNNER_TEMP}/AuthKey.p8"
          printf '%s' "${APPSTORE_API_PRIVATE_KEY}" > "${RUNNER_TEMP}/AuthKey.p8"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(sed -n 's|^MARKETING_VERSION = \([0-9]*\.[0-9]*\.[0-9]*\) // x-release-please-version$|\1|p' Config/Version.xcconfig)"
          test -n "${VERSION}"

          if [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            test "${RELEASE_TAG}" = "v${VERSION}"
          else
            # App Store Connect rejects uploads at or below an approved version,
            # so a build from main is one patch above the committed release.
            VERSION="${VERSION%.*}.$((${VERSION##*.} + 1))"
          fi

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Archive app
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          xcodebuild \
            -project "${PROJECT}" \
            -scheme "${SCHEME}" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "${RUNNER_TEMP}/${APP_NAME}.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/AuthKey.p8" \
            -authenticationKeyID "${APPSTORE_API_KEY_ID}" \
            -authenticationKeyIssuerID "${APPSTORE_ISSUER_ID}" \
            DEVELOPMENT_TEAM="SMLKBTR495" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="WoodBox App Store" \
            MARKETING_VERSION="${VERSION}" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            archive

      - name: Upload to App Store Connect
        run: |
          EXPORT_OPTIONS="${RUNNER_TEMP}/ExportOptions.plist"
          cp Config/ExportOptions-AppStore.plist "${EXPORT_OPTIONS}"

          # Only a build from a release tag may be submitted for review.
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            plutil -insert testFlightInternalTestingOnly -bool true "${EXPORT_OPTIONS}"
          fi

          xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/${APP_NAME}.xcarchive" \
            -exportPath "${RUNNER_TEMP}/export" \
            -exportOptionsPlist "${EXPORT_OPTIONS}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${RUNNER_TEMP}/AuthKey.p8" \
            -authenticationKeyID "${APPSTORE_API_KEY_ID}" \
            -authenticationKeyIssuerID "${APPSTORE_ISSUER_ID}"
